name: Publish EXE update info
on:
  push:
    branches: [main]
    paths:
      - '**/ToothFairyJapan.exe'
      - '**/notes.txt'
      - '.github/workflows/update-manifest.yml'
      - '.github/scripts/Update-Manifest.ps1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-manifest-main
  cancel-in-progress: false
jobs:
  manifest:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate EXE and publish version info
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for($attempt=1; $attempt -le 3; $attempt++) {
            git fetch origin main
            if($LASTEXITCODE -ne 0){throw 'Could not fetch main'}
            git reset --hard origin/main
            if($LASTEXITCODE -ne 0){throw 'Could not synchronize runner checkout'}
            & ./.github/scripts/Update-Manifest.ps1
            git add -- latest.json
            if($LASTEXITCODE -ne 0){throw 'Could not stage manifest'}
            git diff --cached --quiet
            if($LASTEXITCODE -eq 0){Write-Output 'Version information is already current.'; exit 0}
            git commit -m 'Update download manifest [skip ci]'
            if($LASTEXITCODE -ne 0){throw 'Could not commit manifest'}
            git push origin HEAD:main
            if($LASTEXITCODE -eq 0){exit 0}
            Start-Sleep -Seconds 2
          }
          throw 'Could not publish manifest. Check branch permissions and rerun this workflow.'
